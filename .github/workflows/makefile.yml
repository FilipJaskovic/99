name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      NVIM_VERSION: v0.11.5
      XDG_DATA_HOME: ${{ github.workspace }}/.xdg/data
      XDG_CACHE_HOME: ${{ github.workspace }}/.xdg/cache

    steps:
    - uses: actions/checkout@v4

    - name: Install Neovim
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) platform=linux ;;
          macOS) platform=macos ;;
        esac
        case "$(uname -m)" in
          arm64|aarch64) arch=arm64 ;;
          x86_64) arch=x86_64 ;;
        esac
        curl -fLsS --retry 3 "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-${platform}-${arch}.tar.gz" -o "$RUNNER_TEMP/nvim.tar.gz"
        mkdir -p "$RUNNER_TEMP/nvim"
        tar xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP/nvim" --strip-components=1
        echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"

    - name: Install luarocks
      if: runner.os == 'Linux'
      run: sudo apt-get install -y luarocks

    - name: Install luacheck
      if: runner.os == 'Linux'
      run: |
        luarocks install --local luacheck
        echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"

    - name: Install stylua
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -fLsS --retry 3 "https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip" -o "$RUNNER_TEMP/stylua.zip"
        unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
        chmod +x "$RUNNER_TEMP/stylua/stylua"
        echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"

    - name: Install plenary.nvim
      run: git clone https://github.com/nvim-lua/plenary.nvim.git ../plenary.nvim

    - name: Run pr_ready
      if: runner.os == 'Linux'
      run: make pr_ready

    - name: Run tests on macOS
      if: runner.os == 'macOS'
      run: make lua_test docs_smoke

    - uses: actions/setup-node@v4
      if: runner.os == 'Linux'
      with:
        node-version: '22'

    - name: Check generated docs
      if: runner.os == 'Linux'
      run: make docs_check
